<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Server Stats</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<meta name="theme-color" content="#0b1026">
<link rel="preload" href="/fonts/vt323.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/pressstart2p.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/style.css">
<link rel="modulepreload" href="/js/charts.js">
<link rel="modulepreload" href="/js/i18n.js">
<link rel="modulepreload" href="/js/main.js">
<link rel="modulepreload" href="/js/skins.js">
<link rel="modulepreload" href="/js/sky.js">
<link rel="modulepreload" href="/js/state.js">
<link rel="modulepreload" href="/js/tab.js">
<link rel="modulepreload" href="/js/titles.js">
<link rel="modulepreload" href="/js/util.js">
<link rel="modulepreload" href="/js/views/advancements.js">
<link rel="modulepreload" href="/js/views/log.js">
<link rel="modulepreload" href="/js/views/player.js">
<link rel="modulepreload" href="/js/views/server.js">
<link rel="modulepreload" href="/js/views/social.js">
<link rel="modulepreload" href="/js/views/versus.js">
<link rel="modulepreload" href="/js/world3d.js">
<!-- the 3D header: fetched in the background with low priority, ready by the time it starts -->
<link rel="prefetch" href="/assets/js/three.module.min.js">
<link rel="prefetch" href="/api/world3d">
<script>
  // ask for the data right away, while the scripts are still loading (main.js picks this up)
  window.firstData = fetch("/api/data", { cache: "no-store" }).then(r => r.text()).catch(() => null);
</script>
</head>
<body>
<section class="hero">
  <div class="stars"></div>
  <img class="sun" src="/assets/environment/celestial/sun.png" alt="">
  <img class="moon" id="moon" src="/assets/environment/celestial/moon/full_moon.png" alt="">
  <div class="clouds"></div>
  <canvas class="rainfall" id="rain"></canvas>
  <h1 id="title">Server Stats</h1>
  <div class="tag" id="tagline"></div>
  <div class="world" id="world"></div>
  <div class="splash" id="splash"></div><br>
  <div class="online-pill" id="onlinePill"><span class="dot"></span> …</div>
  <div class="mobs" id="mobs"></div>
</section>
<div class="ground"></div><div class="ground2"></div>
<nav class="top" id="nav">
  <button class="btn" data-v="server" id="navServer">Server</button>
  <button class="btn" data-v="players" id="navPlayers">Players</button>
  <button class="btn" data-v="log" id="navLog">Log</button>
  <label class="btn lang-btn"><img class="ico s" src="/assets/item/filled_map.png" alt=""><select id="lang" aria-label="Language"></select></label>
</nav>
<main id="app">
  <div class="loading"><div class="loading-title">Loading world</div><div class="loading-bar"><i></i></div></div>
</main>
<footer id="foot"></footer>
<div class="live" id="live"><span class="dot on"></span> LIVE</div>
<div class="tip" id="tip"></div>
<script async src="/assets/js/skinview3d.bundle.js" onload="window.dispatchEvent(new Event('skinview3d-ready'))"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
